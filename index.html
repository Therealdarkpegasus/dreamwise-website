<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0914">
  <meta name="description" content="Explore the meaning behind your dreams with thoughtful, AI-powered dream interpretations.">
  <title>DreamWise AI — Find meaning in your dreams</title>
  <style>
    :root {
      --bg: #0b0914; --panel: #131020; --panel2: #19152a; --line: rgba(255,255,255,.09);
      --text: #f7f3ff; --muted: #aaa3bd; --purple: #a78bfa; --violet: #8b5cf6;
      --pink: #e5a7e8; --gold: #e9c98b; --radius: 22px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; color: var(--text); background:
      radial-gradient(ellipse at 78% 4%, rgba(111,70,180,.19), transparent 34%),
      radial-gradient(ellipse at 12% 30%, rgba(74,55,130,.13), transparent 35%), var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }
    button, textarea { font: inherit; }
    .wrap { width: min(1120px, calc(100% - 40px)); margin: auto; }
    .nav { height: 78px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:11px; font-weight:750; letter-spacing:-.5px; font-size:19px; }
    .brand-mark { width:36px; height:36px; border-radius:12px; display:grid; place-items:center; color:#171020; background:linear-gradient(140deg,#e9c98b,#b89bf8); box-shadow:0 5px 25px #9b78dc35; }
    .brand-mark svg { width:21px; }
    .nav-links { display:flex; align-items:center; gap:30px; color:var(--muted); font-size:14px; }
    .nav-links a:hover { color:white; }
    .nav-cta, .btn { border:0; cursor:pointer; color:#170f25; background:linear-gradient(110deg,#e7c58b,#c4a2f4); border-radius:999px; padding:12px 19px; font-weight:750; box-shadow:0 8px 30px #9b78dc20; transition:.2s; }
    .nav-cta:hover,.btn:hover { transform:translateY(-2px); filter:brightness(1.06); }
    .hero { padding:88px 0 70px; display:grid; grid-template-columns:1.03fr .97fr; gap:58px; align-items:center; }
    .eyebrow { display:inline-flex; gap:9px; align-items:center; border:1px solid #b89bf844; background:#9b78dc12; color:#d4c0ff; padding:7px 12px; border-radius:999px; font-size:11px; letter-spacing:1.25px; text-transform:uppercase; font-weight:700; }
    .dot { width:6px; height:6px; border-radius:50%; background:#c7a7ff; box-shadow:0 0 12px #c7a7ff; }
    h1 { font-size:clamp(43px,6vw,69px); line-height:1.04; letter-spacing:-3.3px; margin:22px 0 20px; max-width:620px; }
    .gradient { background:linear-gradient(100deg,#f3d59b 8%,#d7b7ff 58%,#e9b6df); color:transparent; background-clip:text; -webkit-background-clip:text; }
    .hero-copy { color:var(--muted); max-width:520px; font-size:18px; margin:0 0 29px; }
    .hero-actions { display:flex; align-items:center; gap:17px; flex-wrap:wrap; }
    .text-link { color:#d9c9f5; font-size:15px; font-weight:650; }
    .trust { display:flex; align-items:center; gap:10px; color:#8e879f; font-size:13px; margin-top:25px; flex-wrap:wrap; }
    .trust span { color:#d5c4f7; }
    .demo-card { border:1px solid #c8a9f02b; border-radius:27px; padding:25px; background:linear-gradient(145deg,#1d1830e8,#100d1b); box-shadow:0 30px 90px #0008, inset 0 1px #ffffff0b; position:relative; overflow:hidden; }
    .demo-card:before { content:""; position:absolute; width:240px; height:240px; border-radius:50%; background:#8b5cf61c; filter:blur(50px); top:-120px; right:-60px; pointer-events:none; }
    .card-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; position:relative; }
    .card-title { font-weight:700; font-size:18px; }
    .secure { color:#a89ebc; font-size:12px; display:flex; gap:6px; align-items:center; }
    .field-label { display:block; font-size:14px; font-weight:650; margin:0 0 9px; color:#e4dcf3; }
    textarea { width:100%; min-height:170px; resize:vertical; border:1px solid #ffffff16; background:#0c0a15; color:#f7f3ff; border-radius:15px; padding:15px; outline:none; font-size:16px; line-height:1.65; }
    textarea:focus { border-color:#a78bfa9c; box-shadow:0 0 0 3px #a78bfa15; }
    textarea::placeholder { color:#716a82; }
    .input-foot { display:flex; justify-content:space-between; color:#8a8399; font-size:12px; margin:8px 2px 18px; gap:12px; }
    .input-foot span:last-child { white-space:nowrap; }
    .btn.full { width:100%; padding:16px; font-size:16px; }
    .demo-note { color:#8f889e; text-align:center; font-size:12px; margin:12px 0 0; }
    .result-panel { display:none; margin-top:26px; position:relative; overflow-wrap:anywhere; }
    .result-panel.show { display:block; animation:rise .5s ease both; }
    @keyframes rise { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
    .rs-head { padding:26px 24px; border:1px solid #c8a9f044; border-radius:22px; background:radial-gradient(ellipse at top left,#8b5cf633,transparent 60%),#151026; }
    .rs-kicker { color:var(--gold); font-size:13px; font-weight:800; letter-spacing:1.6px; text-transform:uppercase; margin-bottom:10px; }
    .result-panel h3.rs-title { margin:0; font-size:clamp(26px,4.6vw,36px); line-height:1.15; letter-spacing:-.8px; color:#fff; }
    .rs-card { border:1px solid var(--line); border-radius:20px; background:#120e20; padding:22px 22px 20px; margin-top:14px; }
    .result-panel h4.rs-label { margin:0 0 14px; font-size:13px; letter-spacing:1.5px; text-transform:uppercase; color:#d7c0ff; display:flex; align-items:center; gap:10px; }
    .rs-label:before { content:""; width:8px; height:8px; border-radius:50%; background:linear-gradient(135deg,#e9c98b,#b89bf8); box-shadow:0 0 12px #b89bf8aa; flex:none; }
    .result-panel .rs-text { font-size:17px; line-height:1.8; color:#e8e1f5; margin:0 0 12px; }
    .result-panel .rs-text:last-child { margin-bottom:0; }
    .rs-overview { border-color:#c8a9f03a; }
    .rs-reflection { background:linear-gradient(135deg,#1c1533,#130f22); border-color:#e9c98b44; }
    .result-panel .rs-quote { font-size:18px; color:#f7efe0; border-left:3px solid #e9c98b; padding-left:16px; }
    .item-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px; }
    .item-card { padding:16px 17px; border-radius:15px; border:1px solid #ffffff12; background:#19142b; }
    .item-name { font-size:17px; font-weight:750; color:#f3d59b; margin-bottom:6px; }
    .item-text { font-size:15.5px; line-height:1.7; color:#d9d1e8; white-space:pre-line; }
    .q-list { list-style:none; counter-reset:q; margin:0; padding:0; display:grid; gap:10px; }
    .q-list li { counter-increment:q; display:flex; gap:14px; align-items:flex-start; padding:14px 16px; border-radius:15px; background:#19142b; border:1px solid #ffffff12; font-size:16.5px; line-height:1.65; color:#eae3f7; }
    .q-list li:before { content:counter(q); flex:none; width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-weight:800; font-size:14px; color:#170f25; background:linear-gradient(135deg,#e7c58b,#c4a2f4); }
    .upsell { margin-top:14px; display:flex; gap:18px; align-items:center; justify-content:space-between; flex-wrap:wrap; padding:22px; border:1px solid #e9c98b55; border-radius:20px; background:linear-gradient(135deg,#2a1f3d,#171127); }
    .upsell-title { font-size:20px; font-weight:800; color:#fff; letter-spacing:-.3px; }
    .result-panel .upsell p { margin:6px 0 0; font-size:15.5px; line-height:1.65; color:#cfc6e0; max-width:520px; }
    .soon-pill { display:inline-block; border:1px solid #b99ce96a; border-radius:999px; padding:9px 16px; font-size:13px; font-weight:700; color:#e8d9ff; background:#9b78dc1c; white-space:nowrap; }
    .rs-actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
    .btn.ghost { background:transparent; color:#e8d9ff; border:1px solid #c8a9f055; box-shadow:none; font-size:14px; padding:11px 18px; }
    .btn.ghost:hover { background:#9b78dc1f; }
    .rs-note { font-size:13px; color:#9d96ae; margin:14px 2px 0; }
    .loading { text-align:center; padding:34px 20px; border:1px solid #c8a9f033; border-radius:20px; background:#120e20; }
    .orb { display:block; width:46px; height:46px; margin:0 auto 16px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#fff3d6,#c4a2f4 55%,#7a56d4); box-shadow:0 0 34px #a78bfa77; animation:pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { transform:scale(.88); opacity:.75; } 50% { transform:scale(1.08); opacity:1; } }
    .result-panel .loading-text { font-size:18px; font-weight:700; color:#f1e8ff; margin:0; }
    .result-panel .loading-sub { font-size:14px; color:var(--muted); margin:6px 0 0; }
    .result-status { color:#bda4ee; font-size:15px; margin:14px 0 0; }
    .result-status.error { color:#ffd0d0; font-size:16px; line-height:1.6; padding:18px 20px; border:1px solid #ff9a9a44; border-radius:16px; background:#2a1219; margin:0; }
    .price-card.featured { border-color:#e9c98b66; background:linear-gradient(145deg,#2a1f3d,#151122); }
    .price-card .btn { display:block; text-align:center; margin-top:22px; }
    .price-card .soon-pill { display:block; text-align:center; margin-top:22px; }
    .soon.live { color:#c3f2d6; border-color:#6fd39a66; background:#3fa86a18; }
    @media (prefers-reduced-motion: reduce) { .orb, .result-panel.show { animation:none; } }
    .section { padding:75px 0; }
    .section-head { text-align:center; max-width:620px; margin:0 auto 38px; }
    .kicker { color:#c4a7f5; font-size:13px; text-transform:uppercase; letter-spacing:1.7px; font-weight:750; }
    h2 { font-size:clamp(29px,4vw,42px); line-height:1.15; letter-spacing:-1.6px; margin:12px 0; }
    .section-head p { color:var(--muted); font-size:16px; margin:0; }
    .features { display:grid; grid-template-columns:repeat(3,1fr); gap:15px; }
    .feature { padding:24px; border:1px solid var(--line); border-radius:19px; background:linear-gradient(145deg,#171327,#100e19); }
    .feature-icon { width:42px; height:42px; display:grid; place-items:center; border-radius:13px; color:#d9c6ff; background:#9b78dc1b; margin-bottom:19px; }
    .feature-icon svg { width:20px; }
    .feature h3 { font-size:18px; margin:0 0 8px; }
    .feature p { color:var(--muted); font-size:15px; margin:0; }
    .how { display:grid; grid-template-columns:repeat(3,1fr); gap:22px; counter-reset:step; }
    .step { border-top:1px solid #b99ce94a; padding-top:20px; }
    .step-num { color:#b99ce9; font-size:12px; letter-spacing:1px; font-weight:800; }
    .step h3 { font-size:19px; margin:10px 0 7px; }
    .step p { color:var(--muted); font-size:15px; margin:0; }
    .quote { max-width:800px; margin:auto; text-align:center; padding:38px 30px; border:1px solid #c5a5f52b; border-radius:24px; background:radial-gradient(ellipse at top,#8b5cf61a,transparent 65%),#141020; }
    .quote p { font-size:clamp(19px,3vw,27px); letter-spacing:-.5px; line-height:1.45; margin:0 0 12px; }
    .quote small { color:var(--muted); font-size:13px; }
    .pricing { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; max-width:1020px; margin:auto; }
    .price-card { border:1px solid var(--line); border-radius:20px; background:#151122; padding:25px; }
    .price-card.highlight { border-color:#b99ce95c; background:linear-gradient(145deg,#211936,#151122); }
    .price-card h3 { margin:0; font-size:20px; }
    .price { font-size:32px; font-weight:800; letter-spacing:-1px; margin:12px 0 3px; }
    .price span { font-size:11px; color:var(--muted); font-weight:500; letter-spacing:0; }
    .price-card p { color:var(--muted); font-size:15px; margin:0 0 18px; }
    .price-card ul { list-style:none; padding:0; margin:0; color:#d5cde2; font-size:15px; }
    .price-card li { margin:9px 0; }
    .price-card li:before { content:"✓"; color:#c8a8ff; margin-right:9px; }
    .soon { color:#d7c0ff; border:1px solid #b99ce94a; border-radius:999px; font-size:11px; padding:4px 9px; margin-left:7px; vertical-align:3px; white-space:nowrap; }
    .disclaimer { color:#8f889e; font-size:12px; text-align:center; max-width:690px; margin:25px auto 0; }
    footer { border-top:1px solid var(--line); padding:27px 0; color:#8f889e; font-size:13px; }
    .footer-inner { display:flex; justify-content:space-between; gap:15px; flex-wrap:wrap; }
    .toast { position:fixed; bottom:22px; left:50%; transform:translate(-50%,20px); opacity:0; pointer-events:none; background:#eee4ff; color:#20172c; padding:12px 17px; border-radius:12px; font-size:14px; font-weight:700; box-shadow:0 10px 35px #0008; transition:.25s; z-index:5; }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    @media(max-width:800px) {
      .hero { grid-template-columns:1fr; padding:65px 0 55px; gap:38px; }
      .hero-copy { max-width:600px; }
      .features { grid-template-columns:1fr 1fr; }
      .pricing { grid-template-columns:1fr; max-width:520px; }
      .nav-links { gap:15px; }
      .nav-links a:not(.nav-cta) { display:none; }
    }
    @media(max-width:540px) {
      .wrap { width:min(100% - 28px,1120px); }
      .nav { height:68px; }
      .brand { font-size:17px; }
      .nav-cta { padding:10px 14px; font-size:13px; }
      .hero { padding:53px 0 45px; }
      h1 { letter-spacing:-2.2px; }
      .demo-card { padding:18px; border-radius:21px; }
      .features,.how,.pricing { grid-template-columns:1fr; }
      .section { padding:55px 0; }
      .section-head { margin-bottom:27px; }
      .footer-inner { flex-direction:column; }
      .rs-head { padding:20px 18px; }
      .rs-card { padding:18px 16px; }
      .result-panel .rs-text { font-size:16px; }
      .upsell { padding:18px; }
    }
  </style>
</head>
<body>
  <header class="wrap nav">
    <a class="brand" href="#" aria-label="DreamWise AI home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19.5 15.5A8 8 0 0 1 8.5 4.5 8.5 8.5 0 1 0 19.5 15.5Z"/><path d="m16.5 3 .7 2.1 2.1.7-2.1.7-.7 2.1-.7-2.1-2.1-.7 2.1-.7.7-2.1Z"/></svg>
      </span>
      DreamWise <span style="color:#c3a4f4">AI</span>
    </a>
    <nav class="nav-links" aria-label="Main navigation">
      <a href="#features">Features</a><a href="#how">How it works</a><a href="#plans">Plans</a>
      <a class="nav-cta" href="#interpret">Interpret a dream</a>
    </nav>
  </header>

  <main>
    <section class="wrap hero">
      <div>
        <div class="eyebrow"><span class="dot"></span> A clearer look at your inner world</div>
        <h1>Your dreams may be saying <span class="gradient">more than you think.</span></h1>
        <p class="hero-copy">Explore the symbols, emotions and stories hidden in your dreams. Get a thoughtful interpretation and a fresh perspective on what they could mean to you.</p>
        <div
